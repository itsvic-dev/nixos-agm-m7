[package]
name = "agm-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agm-home"
path = "src/bin/home.rs"

[[bin]]
name = "agm-bar"
path = "src/bin/bar.rs"

[[bin]]
name = "agm-windows"
path = "src/bin/windows.rs"

[[bin]]
name = "agm-menu"
path = "src/bin/menu.rs"

[[bin]]
name = "agm-settings"
path = "src/bin/settings/main.rs"

[[bin]]
name = "agm-lock"
path = "src/bin/lock.rs"

[dependencies]
ab_glyph = "0.2"
calloop = { version = "0.14", features = ["signals"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
resvg = { version = "0.48.1", default-features = false }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true
